[workspace]
resolver = "3"
members = ["crates/client", "crates/shared", "crates/win-ops"]
default-members = ["crates/client"]

[workspace.package]
version = "1.1.0"
edition = "2024"

[workspace.dependencies]
shared = { path = "crates/shared" }
win-ops = { path = "crates/win-ops" }
surrealdb = { version = "4.0.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3
