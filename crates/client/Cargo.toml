[package]
name = "scanfill"
version.workspace = true
edition.workspace = true
authors = ["Aeon Logics"]
description = "Scan & Fill: scan bill barcodes and type them into payment software"

[package.metadata.wix]
eula = false

[dependencies]
shared = { workspace = true }
thiserror = { workspace = true }
win-ops = { workspace = true }
gpui-kit = { version = "0.8.1", features = ["gpui-fast"] }
surrealdb = { workspace = true, features = ["kv-surrealkv"] }
tokio = { workspace = true }
directories = "6.0.0"
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-subscriber = { workspace = true }
chrono = "0.4.45"
async-channel = "2.5.0"

[build-dependencies]
winresource = "0.1.34"
